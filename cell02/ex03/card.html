
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>
    <div class="card">
        <header>
            <h2>Profile Card</h2>
        </header>

        <table>
            <tr>
                <td>
                    <img class="profile"
                         src="https://i.pravatar.cc/150"
                         alt="Profile Picture">
                </td>
            </tr>

            <tr>
                <td><h3>student42</h3></td>
            </tr>

            <tr>
                <td><p>Software Engineering Student</p></td>
            </tr>

            <tr>
                <td class="social">
                    <!-- GitHub -->
                    <svg viewBox="0 0 24 24">
                        <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 3.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
                    </svg>

                    <!-- Instagram -->
                    <svg viewBox="0 0 24 24">
                        <rect x="2" y="2" width="20" height="20" rx="5"/>
                        <circle cx="12" cy="12" r="4"/>
                        <circle cx="18" cy="6" r="1"/>
                    </svg>

                    <!-- LinkedIn -->
                    <svg viewBox="0 0 24 24">
                        <rect x="2" y="2" width="20" height="20" rx="2"/>
                        <path d="M7 10v8M7 7v.01M12 18v-8m0 3a3 3 0 0 1 6 0v5"/>
                    </svg>
                </td>
            </tr>
        </table>

        <form action="mailto:hello@example.com">
            <button type="submit">Contact</button>
        </form>
    </div>
</body>
</html>
